name: VIRA Router CI

on:
  pull_request:
    paths:
      - "railway/**"
      - ".github/workflows/vira-router-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Verify VIRA router and Railway layer
        run: node --test railway/*.test.mjs

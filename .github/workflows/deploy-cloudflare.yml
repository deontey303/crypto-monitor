name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-monitor-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Validate deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        shell: bash
        run: |
          for required_name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CMC_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!required_name}" ]; then
              echo "::error::Missing GitHub Actions secret: $required_name"
              exit 1
            fi
          done
          if [[ ! "$D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Missing or invalid repository variable: CLOUDFLARE_D1_DATABASE_ID"
            exit 1
          fi
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${D1_DATABASE_ID}/" cloudflare/wrangler.toml

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run Worker tests
        run: node --test cloudflare/worker.test.mjs cloudflare/vira-runtime.test.mjs

      - name: Apply D1 schema
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: "4.136.0"
          command: d1 execute crypto-monitor --remote --file=schema.sql

      - name: Deploy Worker and secrets
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: "4.136.0"
          command: deploy
          secrets: |
            CMC_API_KEY
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Verify deployed watchdog ledger
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          wranglerVersion: "4.136.0"
          command: d1 execute crypto-monitor --remote --command="SELECT event_type,created_at FROM vira_runtime_events ORDER BY created_at DESC LIMIT 5"

      - name: Verify Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const response = await fetch(
            `https://api.telegram.org/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`,
            {
              method: "POST",
              headers: {"Content-Type": "application/json"},
              body: JSON.stringify({
                chat_id: process.env.TELEGRAM_CHAT_ID,
                text: `🟣 Crypto Monitor deployed\nShadow mode · ${process.env.DEPLOYED_SHA.slice(0, 7)}`
              })
            }
          );
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.ok !== true) {
            throw new Error(`Telegram verification failed with HTTP ${response.status}`);
          }
          NODE

name = "crypto-monitor"
main = "worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *", "2,17,32,47 * * * *"]

[vars]
CMC_MONTHLY_BUDGET = "14000"
CMC_CALL_RESERVE = "5"

[[d1_databases]]
binding = "DB"
database_name = "crypto-monitor"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

